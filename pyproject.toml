[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ubersight"
dynamic = ["version"]
description = "Compact terminal sidecar dashboard for development sessions."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "M. Heck"}
]
keywords = ["terminal", "dashboard", "tui", "developer-tools", "monitoring"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Console :: Curses",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Hard-Problems-Group-LLC/ubersight"
Issues = "https://github.com/Hard-Problems-Group-LLC/ubersight/issues"

[project.optional-dependencies]
dev = [
  "black==26.3.1",
  "ruff==0.15.7",
  "pytest==9.0.2",
  "pytest-timeout==2.4.0",
]

[project.scripts]
ubersight = "ubersight.dashboard:main"
ubersight-location-memory = "ubersight.operator_location_memory:main"
ubersight-probe-location = "ubersight.probe_operator_location:main"
ubersight-stop = "ubersight.stop_ubersight:main"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "ubersight.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
target-version = ["py39"]
